name: Link check

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00（北京时间）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: 安装依赖
        run: npm ci
      - name: 巡检外部链接
        id: links
        shell: bash
        run: |
          set -o pipefail
          npm run check:links -- --timeout 20 2>&1 | tee /tmp/links.log
      - name: 恢复后关闭 issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --label link-check --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "链接巡检已恢复，自动关闭。"
          fi
      - name: 记录 issue
        if: failure() && steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create link-check --color BFD4F2 --description "自动链接巡检" 2>/dev/null || true
          body=$(printf '链接巡检失败。\n\n```\n%s\n```\n\n完整日志：%s/%s/actions/runs/%s' \
            "$(tail -n 30 /tmp/links.log)" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          number=$(gh issue list --label link-check --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "链接巡检失败 $(date +%F)" --body "$body" --label link-check
          fi
