name: Link check

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00（北京时间）
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 巡检外部链接
        run: python3 scripts/check_links.py --timeout 20 --workers 24
      - name: 失败时开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "链接巡检失败 $(date +%F)" \
            --body "查看 Actions 运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
