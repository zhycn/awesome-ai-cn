name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验数据规范
        run: python3 scripts/validate.py
      - name: 检查 README 是否与数据一致
        run: python3 scripts/build.py --check
