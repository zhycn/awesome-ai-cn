name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 校验数据规范
        run: npm run validate
      - name: 检查 README 是否与数据一致
        run: npm run build:check
      - name: 检查格式（Markdown + TypeScript）
        run: npm run format:check
      - name: 运行测试
        run: npm test
      - name: 构建静态站点
        run: npm run build:site
      - name: 校验 PR 标题（Conventional Commits）
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx commitlint
