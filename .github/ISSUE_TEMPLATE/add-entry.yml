name: 推荐一个条目
description: 推荐一个值得收录的项目、工具或资源
title: "[条目] "
body:
  - type: markdown
    attributes:
      value: |
        也可以直接在 GitHub 网页上编辑 `data/` 中对应主题的 JSON 文件并发起 PR。步骤见仓库根目录的 `CONTRIBUTING.md`。
  - type: input
    id: name
    attributes:
      label: 名称
      placeholder: 例如 DeepSeek
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 链接
      placeholder: https://...
      description: 官网或仓库地址，必须能直接打开
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: 建议主题
      description: 对应 README 中的某个分节；不确定可以留空
  - type: textarea
    id: desc
    attributes:
      label: 一句话简介
      description: 不超过 60 字，说清它是什么、凭什么值得收
      placeholder: 例如：国产大模型，代码与推理能力突出
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签（可选）
      description: 从 config/tags.json 的词表里挑 1–3 个
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 未被本清单收录过
          required: true
        - label: 项目仍在维护
          required: true
        - label: 中文用户可以直接使用
          required: true
